name: Feature request
description: Propose a focused improvement or ecosystem adapter
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What repository investigation cannot be completed today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Example repository shape
      description: Show a minimal manifest, import, or Git-history example.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Expected result
      description: What should depstory report, and which repository evidence supports it?
    validations:
      required: true
